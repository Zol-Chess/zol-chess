[package]
name = "zol-chess"
version = "0.1.0"
description = "A hybrid chess program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zol_chess"

[features]
default = []
testing = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
mpl-core = { version = "0.11.1", features = ["anchor"] }
brine-ed25519 = "0.4.1"

[dev-dependencies]
litesvm = "=0.7.1"
solana-sdk = "2.3"
