<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ZOL token logo</title>
  <desc id="desc">Gold and violet ZOL chess token mark for an SPL mint.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#281159"/>
      <stop offset="48%" stop-color="#0c0a2f"/>
      <stop offset="100%" stop-color="#050414"/>
    </radialGradient>
    <linearGradient id="gold" x1="20%" y1="10%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#fff3a5"/>
      <stop offset="28%" stop-color="#f6c84f"/>
      <stop offset="55%" stop-color="#b97819"/>
      <stop offset="78%" stop-color="#f0b93f"/>
      <stop offset="100%" stop-color="#6f3f0a"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="22%" y1="12%" x2="82%" y2="94%">
      <stop offset="0%" stop-color="#bb7b1f"/>
      <stop offset="56%" stop-color="#5c3209"/>
      <stop offset="100%" stop-color="#1e1205"/>
    </linearGradient>
    <linearGradient id="violet" x1="16%" y1="12%" x2="84%" y2="88%">
      <stop offset="0%" stop-color="#f6c7ff"/>
      <stop offset="42%" stop-color="#9b4cff"/>
      <stop offset="100%" stop-color="#3b0a8d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.7 0 0 0 0.4 0 0.1 0 0 0 0.9 0 1.4 0 0.95 0 0 0 0.82 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#02010b" flood-opacity="0.72"/>
    </filter>
    <clipPath id="coinClip">
      <circle cx="512" cy="512" r="454"/>
    </clipPath>
  </defs>

  <circle cx="512" cy="512" r="512" fill="#050414"/>
  <circle cx="512" cy="512" r="468" fill="url(#bg)"/>

  <g clip-path="url(#coinClip)" opacity="0.48">
    <path d="M98 272h192l72-72h172" fill="none" stroke="#7f45ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M926 272H734l-72-72H490" fill="none" stroke="#7f45ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 740h196l64 70h150" fill="none" stroke="#7f45ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M920 740H724l-64 70H510" fill="none" stroke="#7f45ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M156 512h96M772 512h96" stroke="#b66cff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="202" cy="348" r="5" fill="#d8b2ff"/>
    <circle cx="822" cy="348" r="5" fill="#d8b2ff"/>
    <circle cx="282" cy="808" r="4" fill="#d8b2ff"/>
    <circle cx="742" cy="808" r="4" fill="#d8b2ff"/>
  </g>

  <circle cx="512" cy="512" r="438" fill="none" stroke="#7c35ff" stroke-width="18" opacity="0.96" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="394" fill="none" stroke="#2b155f" stroke-width="10" opacity="0.9"/>
  <path d="M208 170h180M636 170h180M208 854h180M636 854h180" stroke="#b46aff" stroke-width="16" stroke-linecap="round" opacity="0.92"/>

  <g filter="url(#softShadow)">
    <path d="M514 172 356 330h118l-44 194 185-228H499l15-124Z" fill="url(#gold)" stroke="#1b102f" stroke-width="18" stroke-linejoin="round"/>
    <path d="M604 338 418 570h126l-128 280 274-350H558l46-162Z" fill="url(#gold)" stroke="#1b102f" stroke-width="18" stroke-linejoin="round"/>
    <path d="M514 172 499 296h116L430 524l44-194H356Z" fill="#fff0a3" opacity="0.2"/>
    <path d="M558 500h132L416 850l128-280H418Z" fill="url(#goldDark)" opacity="0.34"/>
  </g>

  <g filter="url(#glow)">
    <path d="M512 390 570 448 512 506 454 448Z" fill="url(#violet)" stroke="#f5d7ff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M512 414 544 448 512 482 480 448Z" fill="#f6d8ff" opacity="0.45"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
    <text x="512" y="738" font-size="152" letter-spacing="18" fill="#16091e" stroke="#16091e" stroke-width="28" stroke-linejoin="round">ZOL</text>
    <text x="512" y="738" font-size="152" letter-spacing="18" fill="url(#gold)" stroke="#fff0a3" stroke-width="4" stroke-linejoin="round">ZOL</text>
  </g>
</svg>
